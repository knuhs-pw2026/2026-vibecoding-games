<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER MEMORY - Neon Card Match</title>
    <meta name="description" content="사이버펑크 네온 카드 짝맞추기 기억력 퍼즐 게임">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <div class="logo-area">
                <h1 class="neon-title">CYBER MEMORY</h1>
                <p class="tagline">NEON NEURAL MATRIX</p>
            </div>

            <div class="stats-panel">
                <div class="stat-badge">
                    <span class="badge-label">TIME</span>
                    <span id="timer-display" class="badge-val">00:00</span>
                </div>
                <div class="stat-badge">
                    <span class="badge-label">MOVES</span>
                    <span id="moves-display" class="badge-val">0</span>
                </div>
                <div class="stat-badge">
                    <span class="badge-label">SCORE</span>
                    <span id="score-display" class="badge-val">0</span>
                </div>
                <div class="stat-badge">
                    <span class="badge-label">COMBO</span>
                    <span id="combo-display" class="badge-val combo-val">x1.0</span>
                </div>
                <button id="btn-sound" class="cyber-icon-btn" aria-label="사운드">🔊</button>
            </div>

            <div class="controls-bar">
                <div class="difficulty-select">
                    <button class="diff-btn active" data-grid="4x4">4x4 (EASY)</button>
                    <button class="diff-btn" data-grid="4x5">4x5 (MEDIUM)</button>
                    <button class="diff-btn" data-grid="6x6">6x6 (HARD)</button>
                </div>
                <button id="btn-restart" class="restart-btn">↺ 리셋 / 새로시작</button>
            </div>
        </header>

        <!-- Card Grid Arena -->
        <main class="grid-arena">
            <div id="card-grid" class="cards-grid grid-4x4"></div>
        </main>

        <!-- Victory Modal -->
        <div id="victory-modal" class="modal-backdrop">
            <div class="victory-card">
                <h2 class="victory-heading">NEURAL SYNC COMPLETE!</h2>
                <p class="victory-sub">모든 사이버 코어 링크를 성공적으로 연결했습니다.</p>

                <div class="results-grid">
                    <div class="result-box">
                        <span class="result-lbl">소요 시간</span>
                        <span id="res-time" class="result-val">00:45</span>
                    </div>
                    <div class="result-box">
                        <span class="result-lbl">시도 횟수</span>
                        <span id="res-moves" class="result-val">18</span>
                    </div>
                    <div class="result-box highlight">
                        <span class="result-lbl">최종 점수</span>
                        <span id="res-score" class="result-val">2,450</span>
                    </div>
                </div>

                <button id="btn-modal-replay" class="cyber-btn">다음 라운드 도전</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
